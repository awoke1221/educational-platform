<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="100" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="2"/>
  
  <!-- Decorative gradient circle - cyan -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#cyanGradient)" stroke-width="3" opacity="0.8"/>
  
  <!-- Hot pink accent circle - partial -->
  <path d="M 100 20 A 80 80 0 0 1 156.57 156.57" fill="none" stroke="#FF1744" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Cyan accent arc - opposite side -->
  <path d="M 100 20 A 80 80 0 0 0 43.43 156.57" fill="none" stroke="#00BCD4" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Central triangle play icon - hot pink -->
  <polygon points="85,75 85,125 120,100" fill="#FF1744" opacity="0.95"/>
  
  <!-- Letter 'A' stylized outline -->
  <g opacity="0.85">
    <path d="M 75 140 L 100 60 L 125 140 M 85 110 L 115 110" fill="none" stroke="#00BCD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGradient">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5FFFE;stop-opacity:1" />
    </radialGradient>
  </defs>
</svg>